# Perfis de filamento PETG e ABS — CoreXY / MKS TinyBee
# Importe com: Arquivo > Importar > Importar Config
# (complementa o PrusaSlicer_CoreXY_TinyBee.ini, que ja traz o PLA)
#
# A ventoinha de peca desta maquina e uma 5015 que PARA em PWM intermediario:
# so funciona em 0% ou 100%. Isso mudou as escolhas de refrigeracao abaixo.
# Nao e preferencia, e limitacao de hardware -- ver o commit sobre FAST_PWM_FAN.

[filament:PETG CoreXY TinyBee]
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 0

temperature = 235
first_layer_temperature = 240
bed_temperature = 75
first_layer_bed_temperature = 75

# PETG pede POUCA refrigeracao (20-40% numa maquina normal). Como aqui so
# existe 0 ou 100%, 100% prejudicaria a adesao entre camadas e causaria
# empenamento. Entao: ventoinha DESLIGADA no geral, 100% so em ponte,
# onde a falta de refrigeracao e pior que o excesso.
cooling = 1
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 0
bridge_fan_speed = 100
disable_fan_first_layers = 3
slowdown_below_layer_time = 10
min_print_speed = 15

# PETG escorre mais; com BMG direct drive, retracao um pouco maior e mais
# lenta -- rapida demais mastiga o filamento, que e mais mole que o PLA.
filament_retract_length = 1.2
filament_retract_speed = 25
filament_deretract_speed = 20

filament_max_volumetric_speed = 7
filament_minimal_purge_on_wipe_tower = 15
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"


[filament:ABS CoreXY TinyBee]
filament_type = ABS
filament_diameter = 1.75
filament_density = 1.04
filament_cost = 0

temperature = 245
first_layer_temperature = 250

# ATENCAO: a mesa desta maquina e 12V. ABS normalmente pede 100-110 C, mas
# com 12V a potencia e um quarto da de 24V e a mesa pode nao chegar la --
# ou demorar tanto que o WATCH_BED_TEMP_PERIOD aborte com "Heating failed".
# 90 C e um alvo realista para comecar. Se a sua mesa alcancar mais, suba.
bed_temperature = 90
first_layer_bed_temperature = 90

# ABS praticamente nao quer ventoinha: refrigeracao causa empenamento e
# separacao entre camadas. Aqui a limitacao da 5015 ate ajuda -- desligada
# e exatamente o que o ABS precisa.
cooling = 0
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 0
bridge_fan_speed = 0
disable_fan_first_layers = 5
slowdown_below_layer_time = 15
min_print_speed = 15

filament_retract_length = 0.8
filament_retract_speed = 30
filament_deretract_speed = 25

filament_max_volumetric_speed = 8
filament_minimal_purge_on_wipe_tower = 15
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
