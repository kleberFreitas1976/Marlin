# Perfil PrusaSlicer 2.9.x — CoreXY / MKS TinyBee
# Importe com: Arquivo > Importar > Importar Config
#
# Os valores aqui refletem a calibracao feita na maquina, nao suposicoes.
# Pontos que vem de limitacoes reais, documentados no gcode inicial:
#   - area util restrita ao centro (malha 3x3 cobre so 100x100mm)
#   - ventoinha de peca so em 0% ou 100% (5015 para em PWM intermediario)
#   - velocidade conservadora (12V; houve perda de passos a 133 mm/s)
#   - aceleracao do extrusor limitada (BMG patina com a do firmware)

[print:CoreXY TinyBee - 0.20mm]
layer_height = 0.2
first_layer_height = 0.3
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = grid

# Velocidades conservadoras. Os testes de velocidade/aceleracao ainda nao
# foram feitos nesta maquina, e a 12V ja houve perda de passos a 133 mm/s.
perimeter_speed = 40
small_perimeter_speed = 25
external_perimeter_speed = 25
infill_speed = 50
solid_infill_speed = 40
top_solid_infill_speed = 30
travel_speed = 60
first_layer_speed = 20
bridge_speed = 25
gap_fill_speed = 25

# Aceleracao modesta: 12V da menos margem de torque na inversao de direcao.
default_acceleration = 1000
perimeter_acceleration = 800
infill_acceleration = 1000
first_layer_acceleration = 500
travel_acceleration = 1000
bridge_acceleration = 800

# VENTOINHA DE PECA: so 0% ou 100%.
# A 5015 desta maquina PARA em PWM intermediario (so gira em 255), entao
# qualquer valor entre 1 e 99% deixaria a peca sem refrigeracao nenhuma.
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
slowdown_below_layer_time = 8
min_print_speed = 15

skirts = 2
skirt_distance = 3
skirt_height = 1
brim_width = 0

support_material = 0
elefant_foot_compensation = 0.1

[filament:PLA CoreXY TinyBee]
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 0
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
filament_max_volumetric_speed = 8
# Ventoinha limitada a liga/desliga, mesmo motivo acima.
min_fan_speed = 100
max_fan_speed = 100
cooling = 1
fan_always_on = 1
disable_fan_first_layers = 2
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"

[printer:CoreXY MKS TinyBee]
printer_technology = FFF
printer_model = CoreXY TinyBee
inherits =

# Mesa medida na maquina: borda esquerda/frente em 0, area util 201 x 193.
bed_shape = 0x0,201x0,201x193,0x193
max_print_height = 250

nozzle_diameter = 0.4
extruders_count = 1
single_extruder_multi_material = 0

gcode_flavor = marlin2
use_relative_e_distances = 1
use_firmware_retraction = 0
remaining_times = 1
silent_mode = 0

# Extrusora BMG direct drive: retracao curta.
# AJUSTE se a sua montagem for bowden (ai use 3 a 5 mm).
retract_length = 0.8
retract_speed = 35
deretract_speed = 25
retract_restart_extra = 0
retract_before_travel = 1.5
retract_layer_change = 1
retract_lift = 0.2
wipe = 1

# Limites so para estimativa de tempo; quem manda e o firmware.
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 5
machine_max_feedrate_e = 25
machine_max_acceleration_x = 3000
machine_max_acceleration_y = 3000
machine_max_acceleration_z = 100
machine_max_acceleration_e = 1000
machine_max_acceleration_extruding = 1000
machine_max_acceleration_travel = 1000
machine_max_acceleration_retracting = 1000

start_gcode = "; ===== INICIO - CoreXY MKS TinyBee =====\n; ATENCAO: a malha de nivelamento cobre apenas o quadrado central\n; (X 50-150, Y 47-147). Posicione a peca nessa regiao.\n;\nM201 E1000 ; limita aceleracao do extrusor (o firmware usa 10000, e a BMG patina)\nM83 ; extrusao em modo relativo\n;\nM140 S{first_layer_bed_temperature[0]} ; inicia aquecimento da mesa\nM104 S{first_layer_temperature[0]} ; inicia aquecimento do bico\nM190 S{first_layer_bed_temperature[0]} ; espera a mesa\nM109 S{first_layer_temperature[0]} ; espera o bico\n;\nG28 ; referencia todos os eixos (o nivelamento liga sozinho: ENABLE_LEVELING_AFTER_G28)\nM420 S1 ; garante a malha ativa\n;\n; --- linha de purga, dentro da area coberta pela malha ---\nG1 Z5 F600\nG1 X55 Y50 F3000\nG1 Z{first_layer_height} F600\nG92 E0\nG1 X145 Y50 E8 F1000 ; primeira passada\nG1 Y50.6 F3000\nG1 X55 E5 F1000 ; segunda passada\nG92 E0\nG1 Z2 F600\nG1 X60 Y60 F3000\n; ===== FIM DO INICIO ====="

end_gcode = "; ===== FIM DA IMPRESSAO =====\nM104 S0 ; desliga o bico\nM140 S0 ; desliga a mesa\nM107 ; desliga a ventoinha de peca (o dissipador e automatico, E0_AUTO_FAN)\n;\nG91 ; relativo\nG1 E-2 F1800 ; retracao final\nG1 Z10 F600 ; afasta da peca\nG90 ; absoluto\n;\nG1 X0 Y190 F3000 ; tira o cabecote da frente\nM84 ; desliga motores\n; ===== FIM ====="

between_objects_gcode =
layer_gcode =
toolchange_gcode =
pause_print_gcode = M601
