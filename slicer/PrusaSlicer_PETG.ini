# Perfil de filamento PETG - CoreXY / MKS TinyBee
# IMPORTAR COM: Arquivo > Importar > Importar Config Bundle
#
# Gerado a partir da estrutura exata do perfil de PLA, que importa
# corretamente. As chaves filament_retract_* foram OMITIDAS de proposito:
# eram elas que faziam o PrusaSlicer descartar a secao em silencio.
# A retracao e herdada da impressora (6mm). Para PETG o ideal sao 7mm --
# ajuste em Config. de filamento > Substituicoes de filamento.

[filament:PETG CoreXY TinyBee]
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 0
filament_settings_id = "PETG CoreXY TinyBee"
temperature = 235
first_layer_temperature = 240
bed_temperature = 75
first_layer_bed_temperature = 75
filament_max_volumetric_speed = 7
cooling = 1
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 0
bridge_fan_speed = 100
disable_fan_first_layers = 3
full_fan_speed_layer = 0
fan_below_layer_time = 20
slowdown_below_layer_time = 10
min_print_speed = 15
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
end_filament_gcode = ""
compatible_printers = 
compatible_printers_condition = 

[presets]
filament = PETG CoreXY TinyBee
