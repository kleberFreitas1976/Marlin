# Perfil de filamento PETG - CoreXY / MKS TinyBee
# IMPORTAR COM: Arquivo > Importar > Importar Config Bundle
#
# Copia da secao PETG do bundle completo (a fonte de verdade). Regenerado
# a partir dele: nao edite este arquivo a mao.
# As chaves filament_retract_* ficam de fora de proposito: o importador as
# rejeita e descarta a secao inteira em silencio. A retracao vem da
# impressora (6mm).

[filament:PETG CoreXY TinyBee]
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 0
temperature = 230
first_layer_temperature = 240
bed_temperature = 75
first_layer_bed_temperature = 75
# Medido em 24/10/2026 (teste de fluxo, PETG 230C): limpo ate 7 mm3/s, falhou
# em 8. O teste e no ar, sem a contrapressao da camada, entao vale 80% do limpo.
filament_max_volumetric_speed = 5.6
cooling = 1
fan_always_on = 0
# A 5015 desta maquina so funciona em 0 ou 100 (para em PWM intermediario),
# entao a escolha e binaria. Fica em 100: PETG sem refrigeracao solda as juntas
# de peca print-in-place, que e o modo de falha mais comum nesse tipo de peca.
# Custa alguma adesao entre camadas; para peca estrutural, desligue.
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 0
fan_below_layer_time = 20
slowdown_below_layer_time = 10
min_print_speed = 15
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
end_filament_gcode = ""
compatible_printers = 
compatible_printers_condition = 

[presets]
filament = PETG CoreXY TinyBee
