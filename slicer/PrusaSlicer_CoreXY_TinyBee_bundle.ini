start_gcode = ; ===== INICIO - CoreXY MKS TinyBee =====\n; Malha de nivelamento cobre a mesa ate X=142 (o probe fica 54mm a esquerda\n; do bico e nao alcanca a borda direita). Y=0 fica 15mm depois do home (as\n; presilhas do vidro ocupam essa faixa). Mesa util: 196 x 176mm: Y 0 a 5 e da\n; purga e fica fora da area de impressao.\nM201 E1000 ; limita aceleracao do extrusor (o firmware usa 10000 e a BMG patina)\nM83 ; extrusao relativa\nM140 S{first_layer_bed_temperature[0]} ; inicia a mesa\nM104 S150 ; bico em espera durante o home: o plastico escorre bem menos que na temperatura de impressao\nM190 S{first_layer_bed_temperature[0]} ; espera a mesa\nG28 ; home com o bico a 150 (o nivelamento liga sozinho: ENABLE_LEVELING_AFTER_G28)\nM420 S1 ; garante a malha ativa\nM104 S{first_layer_temperature[0]} ; so agora sobe o bico para a primeira camada\nG1 Z5 F600\nG1 X55 Y2 F3000 ; vai a purga, 2mm dentro da mesa, enquanto aquece\nM109 S{first_layer_temperature[0]} ; espera o bico\nG1 Z{first_layer_height} F600\nG92 E0\nG1 X140 Y2 E8 F1000 ; linha 1, ida: purga e assenta o fio\nG1 Y2.6 F3000\nG1 X70 E4 F1000 ; linha 2, volta 15mm mais curta: para antes do resto de fio do inicio da linha 1\nG1 Y3.2 F3000\nG1 X140 E4 F1000 ; linha 3, ida: vai ate onde a linha 1 terminou\nG92 E0\nG1 Z2 F600\nG1 X60 Y60 F3000\n; ===== FIM DO INICIO =====
end_gcode = ; ===== FIM DA IMPRESSAO =====\nM104 S0 ; desliga o bico\nM140 S0 ; desliga a mesa\nM107 ; ventoinha de peca (o dissipador e automatico via E0_AUTO_FAN)\nG91\nG1 E-2 F1800\nG1 Z10 F600\nG90\nG1 X5 Y176 F3000\nM84\n; ===== FIM =====

