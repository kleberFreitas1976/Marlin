machine_max_jerk_e = 5,5
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
default_print_profile = CoreXY TinyBee 0.20mm
default_filament_profile = PLA CoreXY TinyBee
between_objects_gcode =
layer_gcode =
toolchange_gcode =
pause_print_gcode = M601
template_custom_gcode =
start_gcode = "; ===== INICIO - CoreXY MKS TinyBee =====\n; A malha de nivelamento cobre apenas o quadrado central (X 50-150, Y 47-147).\n; Posicione a peca nessa regiao.\nM201 E1000 ; limita aceleracao do extrusor (o firmware usa 10000 e a BMG patina)\nM83 ; extrusao relativa\nM140 S{first_layer_bed_temperature[0]} ; inicia a mesa\nM104 S{first_layer_temperature[0]} ; inicia o bico\nM190 S{first_layer_bed_temperature[0]} ; espera a mesa\nM109 S{first_layer_temperature[0]} ; espera o bico\nG28 ; home (o nivelamento liga sozinho: ENABLE_LEVELING_AFTER_G28)\nM420 S1 ; garante a malha ativa\nG1 Z5 F600\nG1 X55 Y50 F3000\nG1 Z{first_layer_height} F600\nG92 E0\nG1 X145 Y50 E8 F1000 ; purga, dentro da area da malha\nG1 Y50.6 F3000\nG1 X55 E5 F1000\nG92 E0\nG1 Z2 F600\nG1 X60 Y60 F3000\n; ===== FIM DO INICIO ====="
end_gcode = "; ===== FIM DA IMPRESSAO =====\nM104 S0 ; desliga o bico\nM140 S0 ; desliga a mesa\nM107 ; ventoinha de peca (o dissipador e automatico via E0_AUTO_FAN)\nG91\nG1 E-2 F1800\nG1 Z10 F600\nG90\nG1 X0 Y190 F3000\nM84\n; ===== FIM ====="

[presets]
print = CoreXY TinyBee 0.20mm
filament = PLA CoreXY TinyBee
printer = CoreXY MKS TinyBee
