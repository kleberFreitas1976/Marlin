# ============================================================================
#  Config Bundle PrusaSlicer 2.9.x — CoreXY / MKS TinyBee
# ============================================================================
#  IMPORTAR COM:  Arquivo > Importar > Importar Config Bundle
#  (NAO use "Importar Config" -- aquele espera arquivo sem secoes)
#
#  Valores vindos da calibracao feita na maquina. Limitacoes reais embutidas:
#    - malha de nivelamento cobre so o quadrado central 100x100
#    - ventoinha de peca so funciona em 0% ou 100% (5015 para em PWM medio)
#    - velocidades conservadoras (12V; houve perda de passos a 133 mm/s)
#    - aceleracao do extrusor limitada no inicio (a BMG patina com 10000)
# ============================================================================

