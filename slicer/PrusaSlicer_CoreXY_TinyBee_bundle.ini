# preenchimento. A espessura da parede deve ser a largura de extrusao do
# perimetro externo, 0,45 mm: multiplicador = 0,45 / espessura medida.
# Tudo a 30 mm/s e 1000 mm/s2 para que velocidade e aceleracao nao entrem na
# conta. Procedimento completo em maquina/calibracao-fluxo.md.
