layer_gcode = G92 E0 ; exigido pela extrusao relativa: zera o acumulador do E a cada camada\nM118 P1 TL:CAMADA {layer_num+1}/{total_layer_count} ; camada para a ESP32-S3-CAM
toolchange_gcode = 
pause_print_gcode = M601
template_custom_gcode = 
start_gcode = ; ===== INICIO - CoreXY MKS TinyBee =====\n; Malha de nivelamento cobre a mesa ate X=142 (o probe fica 54mm a esquerda\n; do bico e nao alcanca a borda direita). Y=0 fica 15mm depois do home (as\n; presilhas do vidro ocupam essa faixa). Mesa util: 196 x 176mm: Y 0 a 5 e da\n; purga e fica fora da area de impressao.\nM118 P1 TL:INICIO {input_filename_base} ; avisa a ESP32-S3-CAM (porta USB)\nM201 E1000 ; limita aceleracao do extrusor (o firmware usa 10000 e a BMG patina)\nM83 ; extrusao relativa\nG28 ; home e malha com os aquecedores DESLIGADOS: o chaveamento da mesa e do bico\n; pode gerar ruido no sensor da sonda (falhas so apareciam com a mesa aquecendo)\nG29 ; malha 5x5 NOVA a cada impressao (~4 min). O vidro pode ter assentado diferente\n; desde a ultima malha. Ao terminar, o G29 ja liga a compensacao;\n; a malha gravada na EEPROM nao e alterada (sem M500).\nM140 S{first_layer_bed_temperature[0]} ; so agora liga a mesa\nM104 S150 ; bico em espera enquanto a mesa aquece: o plastico escorre bem menos que na temperatura de impressao\nG1 Z20 F600 ; espera alto: da para limpar o bico com a mao\nG1 X10 Y10 F3000 ; espera no canto: o que escorrer do bico ao aquecer cai aqui, longe da purga\nM190 S{first_layer_bed_temperature[0]} ; espera a mesa com o bico ainda a 150 (sem plastico parado quente no bico)\nM104 S{first_layer_temperature[0]} ; agora sobe o bico para a primeira camada\nM109 S{first_layer_temperature[0]} ; espera o bico\nG1 Z5 F600 ; desce para a rampa\nG1 X40 Y2 F1500 ; devagar ate 15mm antes da purga, ainda no Z5\nG1 X55 Y2 Z{first_layer_height} F900 ; desce o Z e anda o X juntos: o fio escorrido encosta na mesa e fica nessa rampa\nG92 E0\nG1 X140 Y2 E8 F1000 ; linha 1, ida: purga e assenta o fio\nG1 Y2.6 F3000\nG1 X70 E4 F1000 ; linha 2, volta 15mm mais curta: para antes do resto de fio do inicio da linha 1\nG1 Y3.2 F3000\nG1 X140 E4 F1000 ; linha 3, ida: vai ate onde a linha 1 terminou\nG1 E-2 F2400 ; recolhe no fim da purga: tira a pressao do bico (sem isso ficava um fiapo grande)\nG1 X125 F6000 ; limpa o bico voltando 15mm por cima da linha 3: o fiapo gruda nela\nG1 Z2 F600\nG1 X60 Y60 F3000\nG1 E2 F2400 ; devolve os 2mm: a 1a camada ja recolhe logo em seguida, nao da tempo de escorrer\nG92 E0\n; ===== FIM DO INICIO =====
end_gcode = ; ===== FIM DA IMPRESSAO =====\nM104 S0 ; desliga o bico\nM140 S0 ; desliga a mesa\nM107 ; ventoinha de peca (o dissipador e automatico via E0_AUTO_FAN)\nG91\nG1 E-2 F1800\nG1 Z0.5 F600 ; sobe pouco e sai rapido: o fio estica e parte perto da peca\nG90\nM83\nG1 X5 Y176 F8400 ; (a ultima camada e a mais alta da mesa: nada no caminho)\nG91\nG1 Z10 F600\nG90\nM83\nM84\nM118 P1 TL:FIM ; avisa a ESP32-S3-CAM\n; ===== FIM =====

