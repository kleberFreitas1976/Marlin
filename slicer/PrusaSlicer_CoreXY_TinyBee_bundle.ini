# GTMax3D PLA Speed+ (Produto Nacional), 1,75 mm.
# Etiqueta do rolo: bico 190-220 C, mesa 0-60 C.
# Bico em 205 nas camadas normais e 215 na primeira (aderencia). Era 210: o
# benchy de 25/10/2026 saiu com a proa aspera e fiapos, e mais frio solidifica
# mais rapido nas saliencias.
# Mesa 60 na primeira camada (limite da etiqueta) e 55 no resto.
# DIAMETRO MEDIDO: 1,85 a 1,90 mm (media 1,875), nao os 1,75 da etiqueta.
# O volume cresce com o quadrado do diametro, entao com 1,75 o fatiador
# subestimava o plastico em 14,8% e a parede do cubo de fluxo saiu com 0,60
# mm em vez de 0,45. Medido em 25/10/2026; revisar se mudar de rolo.
# filament_max_volumetric_speed fica em 8 ate rodar o teste de fluxo com ESTE
# filamento: PLA de alta velocidade costuma aguentar mais que o PLA comum, mas
# isso so vale depois de medido (aba Temperatura do console).
[filament:PLA Speed Plus GTMax3D]
filament_type = PLA
filament_diameter = 1.88
filament_density = 1.24
filament_cost = 0
temperature = 205
first_layer_temperature = 215
bed_temperature = 55
first_layer_bed_temperature = 60
filament_max_volumetric_speed = 8
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
full_fan_speed_layer = 0
fan_below_layer_time = 60
slowdown_below_layer_time = 8
min_print_speed = 15
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
end_filament_gcode = ""
compatible_printers =
compatible_printers_condition =

[filament:PETG CoreXY TinyBee]
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 0
temperature = 230
first_layer_temperature = 240
bed_temperature = 75
first_layer_bed_temperature = 75
# Medido em 24/10/2026 (teste de fluxo, PETG 230C): limpo ate 7 mm3/s, falhou
# em 8. O teste e no ar, sem a contrapressao da camada, entao vale 80% do limpo.
filament_max_volumetric_speed = 5.6
cooling = 1
fan_always_on = 0
# A 5015 desta maquina so funciona em 0 ou 100 (para em PWM intermediario),
# entao a escolha e binaria. Fica em 100: PETG sem refrigeracao solda as juntas
# de peca print-in-place, que e o modo de falha mais comum nesse tipo de peca.
# Custa alguma adesao entre camadas; para peca estrutural, desligue.
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 0
fan_below_layer_time = 20
slowdown_below_layer_time = 10
min_print_speed = 15
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
end_filament_gcode = ""
compatible_printers = 
compatible_printers_condition = 

