bottom_fill_pattern = monotonic
perimeter_speed = 40
small_perimeter_speed = 25
external_perimeter_speed = 25
infill_speed = 50
solid_infill_speed = 40
top_solid_infill_speed = 30
support_material_speed = 30
bridge_speed = 25
gap_fill_speed = 25
travel_speed = 60
travel_speed_z = 5
first_layer_speed = 20
first_layer_speed_over_raft = 20
default_acceleration = 1000
perimeter_acceleration = 800
infill_acceleration = 1000
solid_infill_acceleration = 1000
top_solid_infill_acceleration = 800
external_perimeter_acceleration = 800
first_layer_acceleration = 500
first_layer_acceleration_over_raft = 500
travel_acceleration = 1000
bridge_acceleration = 800
wipe_tower_acceleration = 0
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
full_fan_speed_layer = 0
fan_below_layer_time = 60
slowdown_below_layer_time = 8
min_print_speed = 15
skirts = 2
skirt_distance = 3
skirt_height = 1
draft_shield = disabled
brim_width = 0
brim_type = outer_only
brim_separation = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 55
elefant_foot_compensation = 0.1
extrusion_width = 0.45
first_layer_extrusion_width = 0.42
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
