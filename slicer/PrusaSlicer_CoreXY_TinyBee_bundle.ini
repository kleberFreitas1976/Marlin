filament_retract_speed = nil
filament_deretract_speed = nil
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
end_filament_gcode = ""
compatible_printers =
compatible_printers_condition =

[filament:PETG CoreXY TinyBee]
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 0
filament_settings_id = "PETG CoreXY TinyBee"
temperature = 235
first_layer_temperature = 240
bed_temperature = 75
first_layer_bed_temperature = 75
filament_max_volumetric_speed = 7
# PETG pede 20-40% de ventoinha. Como aqui so existe 0 ou 100%, 100%
# constante prejudicaria a adesao entre camadas. Desligada no geral,
# 100% so em ponte, onde faltar refrigeracao e pior que sobrar.
cooling = 1
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 0
bridge_fan_speed = 100
disable_fan_first_layers = 3
full_fan_speed_layer = 0
fan_below_layer_time = 20
slowdown_below_layer_time = 10
min_print_speed = 15
filament_retract_length = 1.2
filament_retract_speed = 25
filament_deretract_speed = 20
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
end_filament_gcode = ""
compatible_printers =
compatible_printers_condition =

[filament:ABS CoreXY TinyBee]
filament_type = ABS
filament_diameter = 1.75
filament_density = 1.04
filament_cost = 0
filament_settings_id = "ABS CoreXY TinyBee"
temperature = 245
first_layer_temperature = 250
# Mesa 12V: ABS pede 100-110 C, mas com um quarto da potencia de uma de 24V
# ela pode nao chegar la, ou demorar a ponto do WATCH_BED_TEMP_PERIOD abortar.
# 90 C e alvo realista. Suba se a sua mesa alcancar.
bed_temperature = 90
first_layer_bed_temperature = 90
filament_max_volumetric_speed = 8
# ABS nao quer ventoinha: refrigeracao causa empenamento e separacao de
# camadas. Aqui a limitacao da 5015 coincide com o que o material precisa.
cooling = 0
fan_always_on = 0
min_fan_speed = 0
max_fan_speed = 0
bridge_fan_speed = 0
disable_fan_first_layers = 5
full_fan_speed_layer = 0
fan_below_layer_time = 10
slowdown_below_layer_time = 15
min_print_speed = 15
filament_retract_length = 0.8
filament_retract_speed = 30
filament_deretract_speed = 25
start_filament_gcode = "M900 K0 ; Linear Advance desligado (nao calibrado)"
end_filament_gcode = ""
compatible_printers =
compatible_printers_condition =

