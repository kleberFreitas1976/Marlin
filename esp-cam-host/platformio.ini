; Central da impressora: ESP32-S3-CAM (N16R8) ligada a TinyBee pela USB OTG.
; Especificacao: ESPECIFICACAO.md
;
; Gravar e ver o log pela porta USB-UART da placa (CH343), nao pela USB-OTG.

[platformio]
default_envs = esp32s3cam

[env:esp32s3cam]
platform = espressif32@6.9.0          ; ESP-IDF 5.3.1. Versao fixa de proposito.
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
extra_scripts = pre:tools/segredos.py

upload_port = COM8
upload_speed = 921600
monitor_port = COM8
monitor_speed = 921600
monitor_filters = direct
